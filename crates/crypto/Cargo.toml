[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

[dev-dependencies]
sha2 = { version = "=0.11.1", default-features = false }                                         # tests/sha256.rs, hmac_hkdf.rs
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "ecdh"] }  # 5c differential tests
primeorder = "=0.14.0"                                                                           # Task 4
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["sha2", "hazmat"] }     # Task 6
hmac = { version = "=0.13.0", default-features = false }                                         # 5a differential tests
hkdf = { version = "=0.13.0", default-features = false }                                         # 5a differential tests
aes = { version = "=0.9.3", default-features = false }                                           # 5b differential tests
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }         # 5b differential tests

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(ct_check)', 'cfg(ct_negative)'] }
