[package]
name = "semconf"
version = "0.1.0"
edition = "2021"

# own workspace: dumped by scripts/ct-check.sh, its vectors written by `cargo test`
[workspace]

# the dump is a --release build without overflow checks; the native runs must wrap the same way
[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false
